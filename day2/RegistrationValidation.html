<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>User Registration Page </title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="RegistrationValidation.css" />

  </head>

  <body>
    <main class="registration-container">
      <div class="card shadow-lg border-0">
        <div class="card-body p-5 p-md-5">
          <h1 class="text-center mb-4 fw-bold">User Registration</h1>

          <form id="registration-form" novalidate>
            <div class="form-group mb-3">
              <label for="fullname">Full Name</label>
              <input
                type="text"
                id="fullname"
                name="fullname"
                class="form-control"
                placeholder="Enter your full name"
                required
              />
              <small id="fullname-error" aria-live="polite"></small>
            </div>

            <div class="form-group mb-3">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                placeholder="Enter your email"
                required
              />
              <small id="email-error" aria-live="polite"></small>
            </div>

            <div class="form-group mb-3">
              <label for="mobile">Mobile Number</label>
              <input
                type="tel"
                id="mobile"
                name="mobile"
                class="form-control"
                placeholder="Enter mobile number"
                required
              />
              <small id="mobile-error" aria-live="polite"></small>
            </div>

            <div class="form-group mb-3">
              <label for="dob">Date of Birth</label>
              <input
                type="date"
                id="dob"
                name="dob"
                class="form-control"
                required
              />
              <small id="dob-error" aria-live="polite"></small>
            </div>

            <div class="form-group mb-3">
              <label for="gender">Gender</label>
              <select id="gender" name="gender" class="form-select" required>
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
              </select>
              <small id="gender-error" aria-live="polite"></small>
            </div>

            <div class="form-group mb-3">
              <label for="password">Password</label>
              <div class="password-box">
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="form-control"
                  placeholder="Enter password"
                  required
                />
              </div>
              <small id="password-error" aria-live="polite"></small>
            </div>

            <div class="form-group mb-3">
              <label for="confirm-password">Confirm Password</label>
              <div class="password-box">
                <input
                  type="password"
                  id="confirm-password"
                  name="confirmPassword"
                  class="form-control"
                  placeholder="Confirm password"
                  required
                />
              </div>
              <small id="confirm-password-error" aria-live="polite"></small>
            </div>

            <div class="form-group mb-3">
              <label for="address">Address</label>
              <textarea
                id="address"
                name="address"
                rows="4"
                class="form-control"
                placeholder="Enter your address"
                required
              ></textarea>
              <small id="address-error" aria-live="polite"></small>
            </div>

            <div class="form-group mb-3">
              <label for="country">Country</label>
              
              <select id="country" name="country" class="form-select mt-2" required>
                <option value=""> Select Country</option>
              </select>
              <small id="country-error" aria-live="polite"></small>
            </div>

            <div class="form-group mb-3">
              
              <select id="state" name="state" class="form-select mt-2" required disabled>
                <option value="">Select Country first</option>
              </select>
              <small id="state-error" aria-live="polite"></small>
            </div>
            <div class="form-group mb-3">
              <div class="form-check">
                <input type="checkbox" id="terms" name="terms" class="form-check-input" required>
                <label for="terms" class="form-check-label">I accept Terms &amp; Conditions</label>
              </div>
              <small id="terms-error" aria-live="polite"></small>
            </div>
            <div class="d-flex flex-column flex-md-row gap-2 mt-4">
              <button type="submit" class="submit-btn btn w-100">Submit</button>
              <button type="reset" class="reset-btn btn w-100">Reset</button>
            </div>
          </form>
          <p id="success-message" role="status" aria-live="polite"></p>

            <div class="text-center mt-4">
                <div class="bottom-links">
                <a href="Loginvalidation.html">Already have an account? Login</a>
            </div>
              
            </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Registrationvalidation.js"></script>
  </body>
</html>
