<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="LoginValidation.css" />
</head>
<body>
    <main class="login-section">
        <form id="login-form" class="login-card" novalidate>
            <h2 class="text-center mb-4 fw-bold">Login</h2>
            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    aria-describedby="email-error"
                    required
                >
                <small id="email-error" class="form-error" aria-live="polite"></small>
            </div>
            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-row">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        aria-describedby="password-error"
                        required
                    >
                </div>
                <small id="password-error" class="form-error" aria-live="polite"></small>
            </div>
            <div class="remember-me">
                <label for="remember">Remember Me</label>
                <input
                    type="checkbox"
                    id="remember"
                    name="remember"
                    aria-describedby="remember-error"
                >
                <small id="remember-error" class="form-error" aria-live="polite"></small>
            </div>
            <button type="submit" class="login-button">
                Login
            </button>
            <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
            <div class="bottom-links">
                <a href="RegistrationValidation.html">New User</a>
                <a href="#">Forgot Password?</a>
            </div>
             <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
             <script src="loginValidation.js"></script>
        </form>
    </main>
</body>
</html>
