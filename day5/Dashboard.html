<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="Dashboard.css" />
    <link rel="stylesheet" href="../index.css" />
</head>
<body>
    <div class="dashboard-page">
        <header class="dashboard-header">
            <div class="container">
                <h1>Employee Dashboard</h1>
            </div>
        </header>

        <main class="container py-4">
            <div class="row g-3 mb-4 stat-grid">
                <div class="col-md-3 col-sm-6">
                    <div class="stat-card stat-blue">
                        <span>Total Employees</span>
                        <h2 id="totalEmployees">0</h2>
                    </div>
                </div>
                <div class="col-md-3 col-sm-6">
                    <div class="stat-card stat-pink">
                        <span>Active Employees</span>
                        <h2 id="activeEmployees">0</h2>
                    </div>
                </div>
                <div class="col-md-3 col-sm-6">
                    <div class="stat-card stat-blue">
                        <span>Active Projects</span>
                        <h2 id="activeProjects">0</h2>
                    </div>
                </div>
                <div class="col-md-3 col-sm-6">
                    <div class="stat-card stat-pink">
                        <span>Unassigned Employees</span>
                        <h2 id="unassignedEmployees">0</h2>
                    </div>
                </div>
            </div>

            <div class="toolbar card-panel mb-4">
                <div class="row g-3 align-items-end">
                    <div class="col-lg-8 col-md-7">
                        <label for="searchInput" class="form-label">Search Employee</label>
                        <input type="text" id="searchInput" class="form-control" placeholder="Search by name or email" />
                    </div>
                    <div class="col-lg-4 col-md-5 text-md-end">
                        <button id="addEmployeeBtn" type="button" class="btn btn-primary add-btn">+ Add Employee</button>
                    </div>
                </div>
            </div>

            <div class="card-panel mb-4 p-3">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="departmentFilter" class="form-label">Department</label>
                        <select id="departmentFilter" class="form-select">
                            <option value="All">All</option>
                            <option value="Engineering">Engineering</option>
                            <option value="Finance">Finance</option>
                            <option value="HR">HR</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Operations">Operations</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="statusFilter" class="form-label">Status</label>
                        <select id="statusFilter" class="form-select">
                            <option value="All">All</option>
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="projectStatusFilter" class="form-label">Project Status</label>
                        <select id="projectStatusFilter" class="form-select">
                            <option value="All">All</option>
                            <option value="Active">Active</option>
                            <option value="Completed">Completed</option>
                            <option value="In Progress">In Progress</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="card-panel mb-4 p-3">
                <div class="row g-3 align-items-end">
                    <div class="col-md-6">
                        <label for="sortFilter" class="form-label">Sort By</label>
                        <select id="sortFilter" class="form-select">
                            <option value="nameAsc">Employee Name ↑</option>
                            <option value="nameDesc">Employee Name ↓</option>
                            <option value="projectsAsc">Number of Projects ↑</option>
                            <option value="projectsDesc">Number of Projects ↓</option>
                            <option value="joiningAsc">Joining Date ↑</option>
                            <option value="joiningDesc">Joining Date ↓</option>
                            <option value="statusAsc">Status ↑</option>
                            <option value="statusDesc">Status ↓</option>
                        </select>
                    </div>
                    <div class="col-md-6 text-md-end">
                        <div class="page-size-label">10 Employees Per Page</div>
                    </div>
                </div>
            </div>

            <div id="alertBox" class="alert d-none" role="alert"></div>

            <div class="card-panel table-panel">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Employee</th>
                                <th>Email</th>
                                <th>Department</th>
                                <th>Projects</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="employeeTableBody"></tbody>
                    </table>
                </div>

                <div class="pagination-wrap">
                    <div id="paginationInfo" class="pagination-info"></div>
                    <nav aria-label="Pagination">
                        <ul id="pagination" class="pagination justify-content-center mb-0"></ul>
                    </nav>
                </div>
            </div>
        </main>
    </div>

    <div id="detailModal" class="modal" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Employee Details</h5>
                    <button type="button" class="btn-close" aria-label="Close" data-close="detailModal"></button>
                </div>
                <div id="detailModalBody" class="modal-body"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-close="detailModal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <div id="employeeFormModal" class="modal" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 id="employeeFormTitle" class="modal-title">Add Employee</h5>
                    <button type="button" class="btn-close" aria-label="Close" data-close="employeeFormModal"></button>
                </div>
                <form id="employeeForm">
                    <div class="modal-body">
                        <div id="formError" class="alert alert-danger d-none" role="alert"></div>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="employeeName" class="form-label">Name</label>
                                <input type="text" id="employeeName" name="name" class="form-control" placeholder="Enter full name" />
                            </div>
                            <div class="col-md-6">
                                <label for="employeeEmail" class="form-label">Email</label>
                                <input type="email" id="employeeEmail" name="email" class="form-control" placeholder="Enter email" />
                            </div>
                            <div class="col-md-6">
                                <label for="employeeMobile" class="form-label">Mobile</label>
                                <input type="tel" id="employeeMobile" name="mobile" class="form-control" placeholder="Enter mobile number" />
                            </div>
                            <div class="col-md-6">
                                <label for="employeeDepartment" class="form-label">Department</label>
                                <select id="employeeDepartment" name="department" class="form-select">
                                    <option value="">Select department</option>
                                    <option value="Engineering">Engineering</option>
                                    <option value="Finance">Finance</option>
                                    <option value="HR">HR</option>
                                    <option value="Marketing">Marketing</option>
                                    <option value="Operations">Operations</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="employeeJoiningDate" class="form-label">Joining Date</label>
                                <input type="date" id="employeeJoiningDate" name="joiningDate" class="form-control" />
                            </div>
                            <div class="col-md-6">
                                <label for="employeeStatus" class="form-label">Status</label>
                                <select id="employeeStatus" name="status" class="form-select">
                                    <option value="">Select status</option>
                                    <option value="Active">Active</option>
                                    <option value="Inactive">Inactive</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-close="employeeFormModal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Employee</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="deleteModal" class="modal" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Delete Employee</h5>
                    <button type="button" class="btn-close" aria-label="Close" data-close="deleteModal"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this employee?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-close="deleteModal">Cancel</button>
                    <button type="button" id="confirmDeleteBtn" class="btn btn-danger">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="Dashboard.js"></script>
    <script src="../task-navigation.js"></script>
</body>
</html>
