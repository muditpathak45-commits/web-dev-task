<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="User.css">
</head>
<body>
    <div class="container py-5">
        <div class="text-center mb-4">
            <h1 class="fw-bold">User Management</h1>
            <p class="text-muted">
                Manage users, search users, edit users and delete users.
            </p>
        </div>
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <label for="searchUser" class="form-label fw-semibold">
                    Search User
                </label>
                <input
                    type="text"
                    id="searchUser"
                    class="form-control"
                    placeholder="Search by name or email"
                >
            </div>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div
        class="modal fade"
        id="editModal"
        tabindex="-1"
        aria-labelledby="editModalLabel"
        aria-hidden="true"
    >
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editModalLabel">
                        Edit User
                    </h5>
                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                    ></button>
                </div>
                <form id="editForm">
                    <div class="modal-body">
                        <input
                            type="hidden"
                            id="editUserId"
                        >
                        <div class="mb-3">
                            <label
                                for="editName"
                                class="form-label"
                            >
                                Name
                            </label>
                            <input
                                type="text"
                                id="editName"
                                class="form-control"
                                required
                            >
                        </div>
                        <div class="mb-3">
                            <label
                                for="editEmail"
                                class="form-label"
                            >
                                Email
                            </label>
                            <input
                                type="email"
                                id="editEmail"
                                class="form-control"
                                required
                            >
                        </div>
                        <div class="mb-3">
                            <label
                                for="editStatus"
                                class="form-label"
                            >
                                Status
                            </label>
                            <select
                                id="editStatus"
                                class="form-select"
                            >
                                <option value="Active">
                                    Active
                                </option>
                                <option value="Inactive">
                                    Inactive
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                        >
                            Cancel
                        </button>
                        <button
                            type="submit"
                            class="btn btn-success"
                        >
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>
    <script src="User.js"></script>
    <script src="../task-navigation.js"></script>
</body>
</html>
