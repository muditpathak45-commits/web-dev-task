       //Operators in javascript
         var a = 10;
         var b = 5;
         var sum = a + b;
         document.write("Sum of a and b is: " + sum);
         document.write("<br>");
         var difference = a - b;
         document.write("Difference of a and b is: " + difference);
         document.write("<br>");
         var product = a * b;
         document.write("Product of a and b is: " + product);
         document.write("<br>");
         var quotient = a / b;
         document.write("Quotient of a and b is: " + quotient);
         document.write("<br>");
         var remainder = a % b;
         document.write("Remainder of a and b is: " + remainder);
         document.write("<br><br>");

         // Assignment Operators
         var c = 10;
         c += 5; // c = c + 5
         document.write("c after += 5: " + c);
         document.write("<br>");
         c -= 3; // c = c - 3
         document.write("c after -= 3: " + c);
         document.write("<br><br>");



         // Comparison Operators
         var x = 10;
         var y = 5;
         document.write("x == y: " + (x == y));
         document.write("<br>");
         document.write("x != y: " + (x != y));
         document.write("<br>");
         document.write("x > y: " + (x > y));
         document.write("<br>");
         document.write("x < y: " + (x < y));
         document.write("<br>");
         document.write("x >= y: " + (x >= y));
         document.write("<br>");
         document.write("x <= y: " + (x <= y));
         document.write("<br><br>");


         // Logical Operators
         var p = true;
         var q = false;
         document.write("p && q: " + (p && q));
         document.write("<br>");
         document.write("p || q: " + (p || q));
         document.write("<br>");
         document.write("!p: " + !p);
         document.write("<br><br>");

         // Conditional Statements
         var age = 18;
         if (age >= 18) {
            document.write("You are an adult.");
         } else {
            document.write("You are a minor.");
         }

         //ternary operator
         var age = 20;
         var message = (age >= 18) ? "You are an adult." : "You are a minor.";
         document.write("<br><br>");
         document.write(message);

         //switch statement
         var day = "Monday";
         switch (day) {
            case "Monday":
               document.write("<br>It's Monday.");
               break;
            case "Tuesday":
               document.write("<br>It's Tuesday.");
               break;
            default:
               document.write("<br>It's some other day.");
         }

         document.write("<br><br>");

         //function in javascript
         function Mudit() {
            document.write("This is a function call.");
         }
         Mudit();
         document.write("<br><br>");

         //function with parameters
         function mudit(a, b) {
            var sum = a + b;
            document.write("<br>Sum of " + a + " and " + b + " is: " + sum);
         }
         mudit(5, 10);

      function hello(name, age) {
         document.write("<br>Hello, " + name + "! You are " + age + " years old.");
      }
      hello("Mudit", 20);

      //function with return value
      function multiplyNumbers(a, b) {
         return a * b;
      }
      var result = multiplyNumbers(5, 10);
      document.write("<br>Product of 5 and 10 is: " + result);

      //function with default parameters
      function greet(name = "Guest") {
         document.write("<br>Hello, " + name + "!");
      }
      greet();

      //function with rest parameters
      function sumAll(...numbers) {
         var sum = 0;
         for (var i = 0; i < numbers.length; i++) {
            sum += numbers[i];
         }
         return sum;
      }
      var total = sumAll(1, 2, 3, 4, 5);
      document.write("<br>Total sum is: " + total);
      document.write("<br><br>");

      //local and global variables
      var globalVar = "I am a global variable.";

      function myFunction() {
         var localVar = "I am a local variable.";
         document.write(localVar + "<br>");
      }
      myFunction();
      document.write(globalVar + "<br>");

      //events 
      function mudit() {
         document.write("Button clicked!");
      }


         // Loops
         //For loop
         document.write("<br><br>");
         document.write("For Loop:<br>");
         for (var i = 0; i < 5; i++) {
            document.write(i + "<br>");
         }

         //While loop
         document.write("<br>While Loop:<br>");
         var j = 0;
         while (j < 5) {
            document.write(j + "<br>");
            j++;
         }

         //Do-While loop
         document.write("<br>Do-While Loop:<br>");
         var k = 0;
         do {
            document.write(k + "<br>");
            k++;
         } while (k < 5);
