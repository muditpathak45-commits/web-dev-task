<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>User Registration Page </title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="RegStylesheet.css" />

  </head>

  <body>
    <main class="registration-container">
      <div class="card shadow-lg border-0">
        <div class="card-body p-4 p-md-5">
          <h1 class="text-center mb-4 fw-bold">User Registration</h1>

          <form id="registrationForm">
            <div class="form-group mb-3">
              <label for="fullName">Full Name</label>
              <input
                type="text"
                id="fullName"
                name="fullName"
                class="form-control"
                placeholder="Enter your full name"
                required
              />
              <small class="error-message"></small>
            </div>

            <div class="form-group mb-3">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                placeholder="Enter your email"
                required
              />
              <small class="error-message"></small>
            </div>

            <div class="form-group mb-3">
              <label for="mobile">Mobile Number</label>
              <input
                type="tel"
                id="mobile"
                name="mobile"
                class="form-control"
                placeholder="Enter mobile number"
                required
              />
              <small class="error-message"></small>
            </div>

            <div class="form-group mb-3">
              <label for="dob">Date of Birth</label>
              <input
                type="date"
                id="dob"
                name="dob"
                class="form-control"
                required
              />
              <small class="error-message"></small>
            </div>

            <div class="form-group mb-3">
              <label for="gender">Gender</label>
              <select id="gender" name="gender" class="form-select" required>
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
              </select>
              <small class="error-message"></small>
            </div>

            <div class="form-group mb-3">
              <label for="password">Password</label>
              <div class="password-box">
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="form-control"
                  placeholder="Enter password"
                  required
                />
                <!-- <button
                  type="button"
                  class="btn btn-outline-secondary"
                  onclick="togglePassword('password', this)"
                >
                  Show
                </button> -->
              </div>
              <small class="error-message"></small>
            </div>

            <div class="form-group mb-3">
              <label for="confirmPassword">Confirm Password</label>
              <div class="password-box">
                <input
                  type="password"
                  id="confirmPassword"
                  name="confirmPassword"
                  class="form-control"
                  placeholder="Confirm password"
                  required
                />
                <!-- <button
                  type="button"
                  class="btn btn-outline-secondary"
                  onclick="togglePassword('confirmPassword', this)"
                >
                  Show
                </button> -->
              </div>
              <small class="error-message"></small>
            </div>

            <div class="form-group mb-3">
              <label for="address">Address</label>
              <textarea
                id="address"
                name="address"
                rows="4"
                class="form-control"
                placeholder="Enter your address"
                required
              ></textarea>
              <small class="error-message"></small>
            </div>

            <div class="form-group mb-3">
              <label for="countrySearch">Country</label>
              <input
                type="text"
                id="countrySearch"
                class="form-control search-input"
                placeholder="Search country"
              />
              <select id="country" name="country" class="form-select mt-2">
                <option value="">Loading countries...</option>
              </select>
              <small class="error-message"></small>
            </div>

            <div class="form-group mb-3">
              <label for="stateSearch">State</label>
              <input
                type="text"
                id="stateSearch"
                class="form-control search-input"
                placeholder="Search state"
                disabled
              />
              <select id="state" name="state" class="form-select mt-2" disabled>
                <option value="">Select country first</option>
              </select>
              <small class="error-message"></small>
            </div>

            <div class="d-flex flex-column flex-md-row gap-2 mt-4">
              <button type="submit" class="submit-btn btn w-100">Submit</button>
              <button type="reset" class="reset-btn btn w-100">Reset</button>
            </div>

            <div class="text-center mt-4">
              <a href="Login/Login.html" class="text-decoration-none"
                >Already have an account? Login</a
              >
            </div>
          </form>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Registration.js"></script>
  </body>
</html>
