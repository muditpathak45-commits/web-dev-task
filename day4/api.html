<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>API Integration</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="api.css" />
    <link rel="stylesheet" href="Tasknavigation.css" />
    <link rel="stylesheet" href="../index.css" />
  </head>

  <body>
    <div class="container py-5">
      <div class="mb-4">
        <h1>API Integration, Filtering & Pagination</h1>

        <p class="text-muted">Fetch, filter, sort and manage users.</p>
      </div>

      <div class="row g-3 mb-4">
        <!-- Search -->
        <div class="col-md-4">
          <label for="searchInput" class="form-label"> Search </label>

          <input
            id="searchInput"
            type="search"
            class="form-control"
            placeholder="Search by name or email"
            aria-label="Search users"
          />
        </div>

        <div class="col-md-4">
          <label for="statusFilter" class="form-label"> Status </label>

          <select id="statusFilter" class="form-select">
            <option value="All">All</option>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>

        <div class="col-md-4">
          <label for="sortBy" class="form-label"> Sort By </label>

          <select id="sortBy" class="form-select">
            <option value="nameAsc">Name A-Z</option>
            <option value="nameDesc">Name Z-A</option>
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
          </select>
        </div>
      </div>

       <div id="loadingMessage" class="text-center py-4">

    <div class="spinner-border text-primary mb-2"
         role="status">
    </div>

    <p class="mb-0">Loading users...</p>

</div>
      <div id="errorMessage" class="alert alert-danger d-none" role="alert">
        <span id="errorText"> Unable to load users. </span>

        <button
          id="retryButton"
          class="btn btn-danger btn-sm ms-3"
          type="button"
        >
          Retry
        </button>
      </div>

      <div id="emptyMessage" class="alert alert-warning d-none" role="status">
        No users found.
      </div>

      <div id="tableContainer" class="table-responsive d-none">
        <table class="table table-bordered table-hover align-middle">
          <thead class="table-dark">
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Email</th>
              <th scope="col">Status</th>
            </tr>
          </thead>

          <tbody id="userTableBody"></tbody>
        </table>
      </div>

      <div
        id="paginationContainer"
        class="d-none flex-column flex-sm-row justify-content-between align-items-center flex-wrap gap-2 mt-3"
      >
        <p
          id="paginationInfo"
          class="text-muted small mb-0"
          aria-live="polite"
        ></p>

        <nav aria-label="User pagination">
          <ul
            id="pagination"
            class="pagination justify-content-center mb-0"
          ></ul>
        </nav>
      </div>
    </div>



    <script src="../task-navigation.js"></script>
            <script src="api.js"></script>
  </body>
</html>
