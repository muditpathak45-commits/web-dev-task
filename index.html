<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web Development Tasks</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                Web Development Tasks
            </span>
        </div>
    </nav>
    <div class="container">
        <div class="card shadow mx-auto mt-5" style="max-width: 700px;">
            <div class="card-body p-4 p-md-5">
                <h2 class="text-center mb-2">
                    Coding Tasks Dashboard
                </h2>
                <p class="text-center text-muted mb-4">
                    Select a task to review
                </p>
                <div class="mb-4">

                    <label for="taskSelect" class="form-label fw-bold">
                        Select Task
                    </label>

                    <select id="taskSelect" class="form-select">

                    </select>

                </div>

                <div class="d-grid mb-4">

                    <button
                        id="openTaskBtn"
                        class="btn btn-primary">

                        Open Task
                    </button>
                </div>

                <div class="d-flex justify-content-between gap-2">
                    <button
                        id="previousBtn"
                        class="btn btn-outline-secondary">

                        ← Previous
                    </button>
                    <button
                        id="dashboardBtn"
                        class="btn btn-outline-dark">

                        Dashboard
                    </button>
                    <button
                        id="nextBtn"
                        class="btn btn-outline-primary">

                        Next →
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const tasks = [
            {
                name: "Registration",
                url: "Registration/Registration.html"
            },

            {
                name: "Registration Validation - Day 02",
                url: "RegistrationValidationDay02/RegistrationValidation.html"
            },

            {
                name: "Login",
                url: "Login/Login.html"
            },

            {
                name: "Login Validation - Day 02",
                url: "LoginValidationDay2/Login.html"
            }
        ];
        const taskSelect =
            document.getElementById("taskSelect");
        const openTaskBtn =
            document.getElementById("openTaskBtn");
        const previousBtn =
            document.getElementById("previousBtn");
        const nextBtn =
            document.getElementById("nextBtn");
        const dashboardBtn =
            document.getElementById("dashboardBtn");

        tasks.forEach(function (task, index) {
            const option =
                document.createElement("option");
            option.value = index;
            option.textContent = task.name;
            taskSelect.appendChild(option);
        });

        openTaskBtn.addEventListener("click", function () {
            const currentIndex =
                Number(taskSelect.value);
            window.location.href =
                tasks[currentIndex].url;
        });

        previousBtn.addEventListener("click", function () {
            const currentIndex =
                Number(taskSelect.value);
            if (currentIndex > 0) {
                const previousIndex =
                    currentIndex - 1;
                taskSelect.value =
                    previousIndex;
                window.location.href =
                    tasks[previousIndex].url;
            }

        });
        nextBtn.addEventListener("click", function () {
            const currentIndex =
                Number(taskSelect.value);
            if (currentIndex < tasks.length - 1) {
                const nextIndex =
                    currentIndex + 1;
                taskSelect.value =
                    nextIndex;

                window.location.href =
                    tasks[nextIndex].url;

            }
        });
        dashboardBtn.addEventListener("click", function () {
            window.location.href = "index.html";
        });

        function updateButtons() {
            const currentIndex =
                Number(taskSelect.value);
            if (currentIndex === 0) {

                previousBtn.disabled = true;

            } else {

                previousBtn.disabled = false;

            }
            if (currentIndex === tasks.length - 1) {

                nextBtn.disabled = true;

            } else {

                nextBtn.disabled = false;

            }

        }


        taskSelect.addEventListener(
            "change",
            updateButtons
        );


        updateButtons();

    </script>

</body>

</html>
